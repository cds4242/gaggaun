<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>가까운교회 — 홈페이지 피드백 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#fbfaf7;--bg2:#f3efe7;--ink:#1a1a1a;--ink-soft:#4a4a4a;--mute:#7a7a7a;
    --line:#e6dfd1;--line-strong:#cdc4b0;
    --accent:#8a1a2b;--accent-soft:#f7e6e8;--gold:#b88a2a;
    --ok:#2e7d4f;--warn:#b85c00;--danger:#b00020;
    --paper:#fff;--shadow:0 4px 14px rgba(0,0,0,.06);--radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}

  /* ====== layout ====== */
  .app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
  .side{background:var(--bg2);border-right:1px solid var(--line);
        padding:24px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .side h1{font-size:18px;margin:0 0 4px;color:var(--accent)}
  .side .sub{font-size:12px;color:var(--mute);margin-bottom:18px}
  .side .group{margin-bottom:14px}
  .side .group-label{font-size:11px;letter-spacing:.18em;color:var(--mute);
    text-transform:uppercase;margin-bottom:6px;padding-left:6px}
  .side a.nav{display:flex;align-items:center;justify-content:space-between;
    padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;
    font-size:14px;cursor:pointer;border:1px solid transparent}
  .side a.nav:hover{background:#fff;border-color:var(--line)}
  .side a.nav.active{background:#fff;border-color:var(--accent);color:var(--accent);font-weight:700}
  .side a.nav .count{font-size:11px;color:var(--mute);
    background:var(--line);border-radius:10px;padding:1px 7px}
  .side a.nav.active .count{background:var(--accent-soft);color:var(--accent)}

  .side .actions{margin-top:24px;display:flex;flex-direction:column;gap:8px}
  .side .actions button{padding:10px 12px;border-radius:8px;border:1px solid var(--line-strong);
    background:#fff;cursor:pointer;font-family:inherit;font-size:13px}
  .side .actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
  .side .actions button.warn{color:var(--danger);border-color:#e6c4c4}
  .side .actions button:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
  .side .status{margin-top:14px;font-size:11px;color:var(--mute);
    padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:6px}

  .main{padding:32px 40px 100px;max-width:980px}
  .crumbs{font-size:12px;color:var(--mute);letter-spacing:.1em;margin-bottom:6px}
  .page-title{font-size:26px;margin:0 0 8px;color:var(--accent)}
  .page-desc{color:var(--ink-soft);margin:0 0 24px;font-size:14px}

  /* ====== onboarding ====== */
  .onboard{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 32px;margin-bottom:24px}
  .onboard h2{margin:0 0 12px;font-size:18px;color:var(--accent)}
  .onboard ol{margin:0;padding-left:20px;color:var(--ink-soft);font-size:14px}
  .onboard ol li{margin-bottom:6px}
  .onboard .tip{margin-top:14px;padding:12px 14px;background:var(--accent-soft);
    border-left:3px solid var(--accent);border-radius:0 6px 6px 0;
    font-size:13px;color:var(--ink-soft)}

  /* ====== card ====== */
  .section-head{display:flex;align-items:baseline;gap:12px;
    padding:14px 0 10px;border-bottom:2px solid var(--line);margin:24px 0 14px;flex-wrap:wrap}
  .section-head h3{margin:0;font-size:17px}
  .section-head .hint{font-size:12px;color:var(--mute)}
  .section-head .view-on-site{margin-left:auto;font-size:12px;color:var(--accent);
    text-decoration:none;padding:4px 10px;border:1px solid var(--accent);border-radius:14px;
    background:#fff;font-family:inherit;cursor:pointer}
  .section-head .view-on-site:hover{background:var(--accent-soft)}

  .page-view-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;
    color:var(--accent);text-decoration:none;padding:6px 12px;border:1px solid var(--accent);
    border-radius:16px;background:#fff;margin-bottom:12px}
  .page-view-link:hover{background:var(--accent-soft)}
  .page-view-link::after{content:"↗"}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin-bottom:14px;transition:border-color .15s}
  .card.changed{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,138,42,.12)}
  .card .head{display:flex;align-items:center;justify-content:space-between;
    gap:10px;margin-bottom:10px}
  .card .label{font-size:12px;letter-spacing:.05em;color:var(--mute);font-weight:700}
  .card .label .pill{display:inline-block;margin-left:6px;font-size:10px;
    background:var(--bg2);padding:2px 7px;border-radius:10px;letter-spacing:0}
  .card .reset{font-size:11px;background:none;border:none;color:var(--mute);
    cursor:pointer;text-decoration:underline;padding:0}
  .card .reset:hover{color:var(--danger)}
  .card .badge-changed{display:none;font-size:11px;color:var(--gold);font-weight:700}
  .card.changed .badge-changed{display:inline}

  .field{margin-bottom:10px}
  .field-label{font-size:11px;color:var(--mute);margin-bottom:4px;letter-spacing:.04em}
  .orig{padding:10px 12px;background:var(--bg2);border-radius:6px;
    white-space:pre-wrap;font-size:14px;color:var(--ink-soft)}
  .orig.long{max-height:140px;overflow:auto}
  textarea,input[type=text]{width:100%;padding:10px 12px;border-radius:6px;
    border:1px solid var(--line-strong);background:#fff;font-family:inherit;
    font-size:14px;line-height:1.6;resize:vertical}
  textarea:focus,input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  textarea.short{min-height:42px}
  textarea.long{min-height:120px}
  .comment{font-style:italic;background:#fffdf6;border-color:#e8dfb8}

  /* ====== image card ====== */
  .img-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
  .img-box{position:relative;border:1px dashed var(--line-strong);border-radius:6px;
    aspect-ratio:4/3;background:var(--bg2);overflow:hidden;display:flex;
    align-items:center;justify-content:center;color:var(--mute);font-size:12px;
    cursor:pointer;transition:border-color .15s}
  .img-box.has-img{border-style:solid;cursor:default}
  .img-box.dragover{border-color:var(--accent);background:var(--accent-soft)}
  .img-box img{width:100%;height:100%;object-fit:cover;display:block}
  .img-box .placeholder{padding:14px;text-align:center;line-height:1.5}
  .img-box .ph-strong{color:var(--accent);font-weight:700;display:block;margin-bottom:4px}
  .img-replace-btn{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.7);
    color:#fff;border:none;padding:5px 10px;border-radius:4px;font-size:11px;
    cursor:pointer;font-family:inherit}
  .img-replace-btn:hover{background:#000}
  .img-info{font-size:12px;color:var(--mute);margin-top:6px;word-break:break-all}

  /* ====== menu editor ====== */
  .menu-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:14px}
  .menu-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    margin-bottom:10px;background:var(--bg)}
  .menu-item.changed{border-color:var(--gold);background:#fffdf6}
  .menu-item-head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .menu-item-head input.title{flex:1;font-weight:700;font-size:15px}
  .menu-item-head input.href{width:200px;font-family:'Courier New',monospace;font-size:13px}
  .menu-btn{padding:6px 10px;font-size:12px;border-radius:6px;border:1px solid var(--line-strong);
    background:#fff;cursor:pointer;font-family:inherit}
  .menu-btn.del{color:var(--danger);border-color:#e6c4c4}
  .menu-btn:hover{background:var(--bg2)}
  .submenu-list{margin-left:18px;padding-left:14px;border-left:2px solid var(--line)}
  .submenu-item{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .submenu-item input.title{flex:1;padding:6px 10px;font-size:13px}
  .submenu-item input.href{width:200px;padding:6px 10px;font-family:'Courier New',monospace;font-size:12px}
  .add-submenu{margin-top:6px;font-size:12px;background:none;border:1px dashed var(--line-strong);
    padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute);font-family:inherit}
  .add-submenu:hover{color:var(--accent);border-color:var(--accent)}
  .add-top{margin-top:14px;width:100%;padding:12px;border:1px dashed var(--line-strong);
    background:none;border-radius:8px;cursor:pointer;color:var(--mute);font-family:inherit;font-size:14px}
  .add-top:hover{color:var(--accent);border-color:var(--accent)}

  /* ====== modal ====== */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;
    align-items:center;justify-content:center;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:#fff;border-radius:12px;max-width:600px;width:100%;
    max-height:80vh;overflow:auto;padding:28px 32px}
  .modal h3{margin:0 0 14px;color:var(--accent)}
  .modal pre{background:var(--bg2);padding:14px;border-radius:6px;font-size:12px;
    overflow:auto;max-height:300px}
  .modal-actions{margin-top:18px;display:flex;gap:10px;justify-content:flex-end}
  .modal-actions button{padding:10px 18px;border-radius:6px;border:1px solid var(--line-strong);
    background:#fff;cursor:pointer;font-family:inherit;font-size:14px}
  .modal-actions button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:12px 22px;border-radius:24px;
    font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:200}
  .toast.show{opacity:1}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
    .main{padding:24px 20px 80px}
    .img-wrap{grid-template-columns:1fr}
    .menu-item-head{flex-wrap:wrap}
    .menu-item-head input.href{width:100%}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <h1>가까운교회</h1>
    <div class="sub">홈페이지 피드백 도구</div>
    <nav id="nav-list"></nav>
    <div class="actions">
      <button class="primary" id="btn-export">내보내기 (JSON 저장)</button>
      <button id="btn-summary">변경 요약 보기</button>
      <button id="btn-import">불러오기</button>
      <button class="warn" id="btn-reset-all">전부 되돌리기</button>
    </div>
    <div class="status" id="status">변경 없음</div>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- summary modal -->
<div class="modal-bg" id="modal-summary">
  <div class="modal">
    <h3>변경 요약</h3>
    <div id="summary-content"></div>
    <div class="modal-actions">
      <button onclick="closeModal('modal-summary')">닫기</button>
    </div>
  </div>
</div>

<!-- import modal -->
<div class="modal-bg" id="modal-import">
  <div class="modal">
    <h3>JSON 불러오기</h3>
    <p style="font-size:13px;color:var(--mute);margin:0 0 12px">
      이전에 저장한 JSON 내용을 붙여넣으세요. 진행하던 작업을 이어서 할 수 있습니다.
    </p>
    <textarea id="import-text" style="min-height:200px;font-family:'Courier New',monospace;font-size:12px" placeholder='{"version":1,...}'></textarea>
    <div class="modal-actions">
      <button onclick="closeModal('modal-import')">취소</button>
      <button class="primary" onclick="doImport()">불러오기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<input type="file" id="file-input" accept="image/*" style="display:none">

<script>
// ============================================================

// ============================================================
//  상태 관리 (localStorage 자동 저장)
// ============================================================
const STORAGE_KEY = "church-edit-state-v1";

let state = loadState();
let currentPageId = state.currentPageId || "home";

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if (parsed && parsed.version === 1) return parsed;
  } catch(e){}
  return defaultState();
}
function defaultState(){
  return {
    version: 1,
    createdAt: new Date().toISOString(),
    currentPageId: "home",
    edits: {},     // id -> { value, comment, imgData, imgName, imgType }
    menuEdits: null, // null = 변경 안 함. 객체면 {brand, cta, nav} 전체 덮어쓰기
  };
}
function saveState(){
  state.currentPageId = currentPageId;
  state.updatedAt = new Date().toISOString();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){
    toast("저장 공간이 부족합니다. 큰 이미지는 줄여주세요.");
  }
  renderStatus();
  refreshNavCounts();
}

// ============================================================
//  렌더링
// ============================================================
function pageById(id){ return CATALOG.pages.find(p => p.id === id); }

function countChanges(pageId){
  let n = 0;
  if (pageId === "menu") return state.menuEdits ? 1 : 0;
  const page = pageById(pageId);
  if (!page || !page.sections) return 0;
  page.sections.forEach(s => s.items.forEach(it => {
    const e = state.edits[it.id];
    if (!e) return;
    if (it.type === "image") { if (e.imgData) n++; }
    else { if (e.value && e.value !== it.original) n++; }
    if (e.comment) n++;
  }));
  return n;
}

function renderNav(){
  const el = document.getElementById("nav-list");
  el.innerHTML = "";
  const groups = [
    { label: "메뉴", ids: ["menu"] },
    { label: "메인", ids: ["home"] },
    { label: "교회소개", ids: ["about","greeting","vision","history","location"] },
    { label: "기타", ids: ["gallery"] },
  ];
  groups.forEach(g => {
    const div = document.createElement("div");
    div.className = "group";
    div.innerHTML = `<div class="group-label">${g.label}</div>`;
    g.ids.forEach(pid => {
      const p = pageById(pid);
      if (!p) return;
      const a = document.createElement("a");
      a.className = "nav" + (pid === currentPageId ? " active" : "");
      a.dataset.pid = pid;
      const c = countChanges(pid);
      a.innerHTML = `<span>${p.title}</span><span class="count" style="${c?'':'display:none'}">${c}</span>`;
      a.onclick = () => { currentPageId = pid; saveState(); renderAll(); window.scrollTo(0,0); };
      div.appendChild(a);
    });
    el.appendChild(div);
  });
}

function refreshNavCounts(){
  document.querySelectorAll(".side a.nav").forEach(a => {
    const c = countChanges(a.dataset.pid);
    const cnt = a.querySelector(".count");
    cnt.textContent = c;
    cnt.style.display = c ? "" : "none";
  });
}

function renderStatus(){
  const total = CATALOG.pages.reduce((acc,p) => acc + countChanges(p.id), 0);
  const el = document.getElementById("status");
  if (total === 0){
    el.textContent = "변경 없음";
    el.style.color = "var(--mute)";
  } else {
    el.innerHTML = `<strong style="color:var(--gold)">${total}건</strong> 변경됨 · 자동 저장됨`;
  }
}

function renderAll(){
  renderNav();
  renderStatus();
  renderMain();
}

function renderMain(){
  const main = document.getElementById("main");
  const page = pageById(currentPageId);
  if (!page){ main.innerHTML = ""; return; }

  const previewUrl = page.path && !page.noPreview ? `${LIVE_SITE}${page.path}` : null;
  let html = `
    <div class="crumbs">${page.id === "home" ? "홈" : page.title}</div>
    <h2 class="page-title">${page.title}</h2>
    <p class="page-desc">${page.desc}</p>
    ${previewUrl ? `<a class="page-view-link" href="${previewUrl}" target="_blank" rel="noopener">이 페이지를 실제 사이트에서 보기</a>` : ""}
  `;

  if (currentPageId === "home"){
    html += `
      <div class="onboard">
        <h2>처음이신가요?</h2>
        <ol>
          <li>왼쪽 메뉴에서 편집할 페이지를 고릅니다.</li>
          <li>바꾸고 싶은 항목의 <b>"바꾸려는 내용"</b> 칸에 새 글자를 적습니다. 그대로 둘 항목은 비워두세요.</li>
          <li>설명이 필요하면 <b>"코멘트"</b>에 자유롭게 적어주세요. (예: "여기 좀 더 따뜻한 느낌으로", "이 단어 빼주세요")</li>
          <li>사진을 바꾸려면 이미지 영역에 새 사진 파일을 끌어다 놓거나 클릭해서 고르세요.</li>
          <li>다 하셨으면 왼쪽 아래 <b>"내보내기"</b>를 눌러 파일을 저장하고 담당자에게 보내주시면 됩니다.</li>
        </ol>
        <div class="tip">💡 작업한 내용은 브라우저에 자동 저장됩니다. 닫았다 다시 열어도 이어서 작업할 수 있어요.</div>
      </div>
    `;
  }

  main.innerHTML = html;

  if (page.type === "menu"){
    renderMenuEditor(main);
  } else {
    page.sections.forEach(s => renderSection(main, s));
  }
}

// 섹션 id를 사이트의 data-edit-section 값으로 매핑.
// 명시적 매핑이 있는 케이스는 여기서 처리하고, 없으면 첫 아이템 id의 앞 2개 토큰을 사용.
const SECTION_ANCHOR_OVERRIDES = {
  "home.notices": "home.notices",       // 공지/이번 주 패널을 묶어둠
  "vision.values": "vision.values",
  "history.timeline": "history.timeline",
  "about.items": "about.items",
  "greeting.body": "greeting.body",
  "location.info": "location.info",
  "gallery.filter": "gallery.filter",
};
function sectionAnchor(page, section){
  const key = `${page.id}.${section.id}`;
  if (SECTION_ANCHOR_OVERRIDES[key]) return SECTION_ANCHOR_OVERRIDES[key];
  // 헤더 섹션은 {page}.header
  if (section.id === "header") return `${page.id}.header`;
  // 그 외는 첫 아이템 id에서 앞 2개 토큰
  const first = section.items[0];
  if (!first) return null;
  return first.id.split(".").slice(0, 2).join(".");
}

function renderSection(main, section){
  const page = pageById(currentPageId);
  const head = document.createElement("div");
  head.className = "section-head";
  let inner = `<h3>${section.title}</h3>`;
  if (section.managedByAdmin){
    inner += `<span class="hint">관리자 페이지에서 관리</span>`;
  } else {
    inner += `<span class="hint">${section.items.length}개 항목</span>`;
    const anchor = sectionAnchor(page, section);
    if (page.path && !page.noPreview && anchor){
      const url = `${LIVE_SITE}${page.path}?edit=${encodeURIComponent(anchor)}`;
      inner += `<a class="view-on-site" href="${url}" target="_blank" rel="noopener" title="이 영역을 사이트에서 강조해서 보여줍니다">↗ 사이트에서 위치 보기</a>`;
    }
  }
  head.innerHTML = inner;
  main.appendChild(head);

  if (section.managedByAdmin){
    const card = document.createElement("div");
    card.className = "card";
    card.style.background = "var(--bg2)";
    card.style.borderStyle = "dashed";
    card.innerHTML = `
      <div class="label" style="margin-bottom:8px">관리자 페이지에서 관리합니다</div>
      <p style="margin:0 0 12px;font-size:14px;color:var(--ink-soft)">${section.managedNote || ""}</p>
      <a href="${LIVE_SITE}${section.managedByAdmin}" target="_blank" rel="noopener"
         class="page-view-link" style="margin:0">관리자 페이지 열기</a>
    `;
    main.appendChild(card);
    return;
  }

  section.items.forEach(it => main.appendChild(renderItem(it)));
}

function isChanged(it){
  const e = state.edits[it.id];
  if (!e) return false;
  if (it.type === "image") return !!e.imgData;
  return (e.value && e.value !== it.original) || !!e.comment;
}

function renderItem(it){
  const card = document.createElement("div");
  card.className = "card" + (isChanged(it) ? " changed" : "");
  card.dataset.id = it.id;

  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML = `
    <div class="label">${it.label}
      <span class="pill">${it.type === "image" ? "이미지" : (it.type === "longtext" ? "긴글" : "짧은글")}</span>
      <span class="badge-changed">● 변경됨</span>
    </div>
    <button class="reset" type="button">되돌리기</button>
  `;
  head.querySelector(".reset").onclick = () => {
    delete state.edits[it.id];
    saveState();
    renderMain();
  };
  card.appendChild(head);

  if (it.type === "image"){
    card.appendChild(renderImageBody(it));
  } else {
    card.appendChild(renderTextBody(it));
  }

  return card;
}

function renderTextBody(it){
  const wrap = document.createElement("div");
  const e = state.edits[it.id] || {};
  const isLong = it.type === "longtext";

  wrap.innerHTML = `
    <div class="field">
      <div class="field-label">현재 사이트 내용</div>
      <div class="orig ${isLong ? 'long' : ''}"></div>
    </div>
    <div class="field">
      <div class="field-label">바꾸려는 내용 (그대로 둘 거면 비워두세요)</div>
      <textarea class="new-val ${isLong ? 'long' : 'short'}" placeholder="여기에 새 글자를 적어주세요"></textarea>
    </div>
    <div class="field">
      <div class="field-label">코멘트 (선택)</div>
      <textarea class="comment short" placeholder="더 설명할 게 있으면 적어주세요. 예: 좀 더 따뜻한 느낌으로 / 이 단어는 빼주세요"></textarea>
    </div>
  `;
  wrap.querySelector(".orig").textContent = it.original;
  const newVal = wrap.querySelector(".new-val");
  const cmt = wrap.querySelector(".comment");
  newVal.value = e.value || "";
  cmt.value = e.comment || "";

  function update(){
    const cur = state.edits[it.id] || {};
    cur.value = newVal.value;
    cur.comment = cmt.value;
    if (!cur.value && !cur.comment) delete state.edits[it.id];
    else state.edits[it.id] = cur;
    // 카드 강조만 즉시 토글, 전체 리렌더는 하지 않음(입력 흐름 유지)
    const card = wrap.closest(".card");
    if (isChanged(it)) card.classList.add("changed");
    else card.classList.remove("changed");
    refreshNavCounts();
    renderStatus();
    debouncedSave();
  }
  newVal.addEventListener("input", update);
  cmt.addEventListener("input", update);
  return wrap;
}

function renderImageBody(it){
  const wrap = document.createElement("div");
  const e = state.edits[it.id] || {};
  wrap.innerHTML = `
    <div class="img-wrap">
      <div>
        <div class="field-label">현재</div>
        <div class="img-box" style="cursor:default"><div class="placeholder">${it.original}</div></div>
      </div>
      <div>
        <div class="field-label">새 이미지 (드래그앤드롭 또는 클릭)</div>
        <div class="img-box new-img-box">
          <div class="placeholder">
            <span class="ph-strong">사진 끌어 놓기</span>
            또는 클릭하여 선택
          </div>
        </div>
        <div class="img-info"></div>
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <div class="field-label">코멘트 (어떤 사진이면 좋겠는지)</div>
      <textarea class="comment short" placeholder="예: 주일 1부 예배 때 찍은 사진으로 / 외관 사진은 가로 비율로"></textarea>
    </div>
  `;
  const box = wrap.querySelector(".new-img-box");
  const info = wrap.querySelector(".img-info");
  const cmt = wrap.querySelector(".comment");
  cmt.value = e.comment || "";

  function paintImg(data, name, size){
    box.classList.add("has-img");
    box.innerHTML = "";
    const img = document.createElement("img");
    img.src = data;
    box.appendChild(img);
    const btn = document.createElement("button");
    btn.className = "img-replace-btn";
    btn.textContent = "다른 사진으로";
    btn.onclick = (ev) => { ev.stopPropagation(); pickFile(); };
    box.appendChild(btn);
    info.textContent = `${name} · ${Math.round(size/1024)}KB`;
  }
  if (e.imgData) paintImg(e.imgData, e.imgName, e.imgSize || 0);

  function handleFile(file){
    if (!file) return;
    if (!file.type.startsWith("image/")){ toast("이미지 파일만 올릴 수 있어요."); return; }
    if (file.size > 4 * 1024 * 1024){
      if (!confirm("이미지가 큽니다 (" + Math.round(file.size/1024) + "KB). 그래도 진행할까요? 너무 크면 저장이 안될 수 있어요.")) return;
    }
    const reader = new FileReader();
    reader.onload = ev => {
      const data = ev.target.result;
      const cur = state.edits[it.id] || {};
      cur.imgData = data; cur.imgName = file.name; cur.imgType = file.type; cur.imgSize = file.size;
      state.edits[it.id] = cur;
      paintImg(data, file.name, file.size);
      const card = wrap.closest(".card");
      card.classList.add("changed");
      refreshNavCounts(); renderStatus(); saveState();
    };
    reader.readAsDataURL(file);
  }
  function pickFile(){
    const inp = document.getElementById("file-input");
    inp.value = "";
    inp.onchange = () => handleFile(inp.files[0]);
    inp.click();
  }

  box.addEventListener("click", pickFile);
  box.addEventListener("dragover", e => { e.preventDefault(); box.classList.add("dragover"); });
  box.addEventListener("dragleave", () => box.classList.remove("dragover"));
  box.addEventListener("drop", e => {
    e.preventDefault(); box.classList.remove("dragover");
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  cmt.addEventListener("input", () => {
    const cur = state.edits[it.id] || {};
    cur.comment = cmt.value;
    if (!cur.value && !cur.comment && !cur.imgData) delete state.edits[it.id];
    else state.edits[it.id] = cur;
    const card = wrap.closest(".card");
    if (isChanged(it)) card.classList.add("changed"); else card.classList.remove("changed");
    refreshNavCounts(); renderStatus(); debouncedSave();
  });

  return wrap;
}

// ============================================================
//  메뉴 편집기
// ============================================================
function getCurrentMenu(){
  if (state.menuEdits) return JSON.parse(JSON.stringify(state.menuEdits));
  const page = pageById("menu");
  return { brand: {...page.brand}, cta: {...page.cta}, nav: JSON.parse(JSON.stringify(page.nav)) };
}
function setMenu(m){
  const page = pageById("menu");
  const def = JSON.stringify({brand: page.brand, cta: page.cta, nav: page.nav});
  state.menuEdits = (JSON.stringify(m) === def) ? null : m;
  saveState();
}

function renderMenuEditor(main){
  const m = getCurrentMenu();

  // 브랜드
  const brand = document.createElement("div");
  brand.className = "menu-block";
  brand.innerHTML = `
    <h3 style="margin:0 0 10px">로고 영역 (좌측 상단)</h3>
    <div class="field"><div class="field-label">한글 이름</div><input type="text" id="brand-ko" value=""></div>
    <div class="field"><div class="field-label">영문 부제</div><input type="text" id="brand-en" value=""></div>
  `;
  main.appendChild(brand);
  brand.querySelector("#brand-ko").value = m.brand.ko;
  brand.querySelector("#brand-en").value = m.brand.en;

  // CTA
  const cta = document.createElement("div");
  cta.className = "menu-block";
  cta.innerHTML = `
    <h3 style="margin:0 0 10px">우측 강조 버튼</h3>
    <div class="field"><div class="field-label">버튼 글자</div><input type="text" id="cta-label" value=""></div>
    <div class="field"><div class="field-label">연결 주소</div><input type="text" id="cta-href" value="" style="font-family:'Courier New',monospace"></div>
  `;
  main.appendChild(cta);
  cta.querySelector("#cta-label").value = m.cta.label;
  cta.querySelector("#cta-href").value = m.cta.href;

  // 메인 메뉴
  const navHead = document.createElement("div");
  navHead.className = "section-head";
  navHead.innerHTML = `<h3>메인 메뉴 ${m.nav.length}개</h3><span class="hint">↑↓ 순서 / 클릭하여 수정 / 삭제 / 추가</span>`;
  main.appendChild(navHead);

  const navBox = document.createElement("div");
  navBox.id = "nav-edit-list";
  main.appendChild(navBox);

  function renderNavList(){
    navBox.innerHTML = "";
    m.nav.forEach((item, idx) => {
      const orig = pageById("menu").nav[idx];
      const changed = !orig || orig.label !== item.label || orig.href !== item.href
                     || JSON.stringify(orig.children) !== JSON.stringify(item.children);
      const el = document.createElement("div");
      el.className = "menu-item" + (changed ? " changed" : "");
      const head = document.createElement("div");
      head.className = "menu-item-head";
      head.innerHTML = `
        <input type="text" class="title" placeholder="메뉴명">
        <input type="text" class="href" placeholder="/path">
        <button class="menu-btn up">↑</button>
        <button class="menu-btn down">↓</button>
        <button class="menu-btn del">삭제</button>
      `;
      const ti = head.querySelector("input.title"); ti.value = item.label;
      const hi = head.querySelector("input.href"); hi.value = item.href;
      ti.oninput = () => { item.label = ti.value; setMenu(m); el.classList.add("changed"); };
      hi.oninput = () => { item.href = hi.value; setMenu(m); el.classList.add("changed"); };
      head.querySelector(".up").onclick = () => { if (idx>0){ [m.nav[idx-1], m.nav[idx]] = [m.nav[idx], m.nav[idx-1]]; setMenu(m); renderNavList(); } };
      head.querySelector(".down").onclick = () => { if (idx<m.nav.length-1){ [m.nav[idx+1], m.nav[idx]] = [m.nav[idx], m.nav[idx+1]]; setMenu(m); renderNavList(); } };
      head.querySelector(".del").onclick = () => { if (confirm(`"${item.label}" 메뉴를 삭제할까요?`)){ m.nav.splice(idx,1); setMenu(m); renderNavList(); } };
      el.appendChild(head);

      // 서브
      const subWrap = document.createElement("div");
      subWrap.className = "submenu-list";
      (item.children || []).forEach((sub, si) => {
        const row = document.createElement("div");
        row.className = "submenu-item";
        row.innerHTML = `
          <input type="text" class="title" placeholder="하위 메뉴명">
          <input type="text" class="href" placeholder="/path">
          <button class="menu-btn up">↑</button>
          <button class="menu-btn down">↓</button>
          <button class="menu-btn del">×</button>
        `;
        const sti = row.querySelector(".title"); sti.value = sub.label;
        const shi = row.querySelector(".href"); shi.value = sub.href;
        sti.oninput = () => { sub.label = sti.value; setMenu(m); el.classList.add("changed"); };
        shi.oninput = () => { sub.href = shi.value; setMenu(m); el.classList.add("changed"); };
        row.querySelector(".up").onclick = () => { if (si>0){ [item.children[si-1], item.children[si]] = [item.children[si], item.children[si-1]]; setMenu(m); renderNavList(); } };
        row.querySelector(".down").onclick = () => { if (si<item.children.length-1){ [item.children[si+1], item.children[si]] = [item.children[si], item.children[si+1]]; setMenu(m); renderNavList(); } };
        row.querySelector(".del").onclick = () => { item.children.splice(si,1); setMenu(m); renderNavList(); };
        subWrap.appendChild(row);
      });
      const addSub = document.createElement("button");
      addSub.className = "add-submenu";
      addSub.textContent = "+ 하위 메뉴 추가";
      addSub.onclick = () => {
        if (!item.children) item.children = [];
        item.children.push({ label: "새 하위 메뉴", href: "/" });
        setMenu(m); renderNavList();
      };
      subWrap.appendChild(addSub);
      el.appendChild(subWrap);

      navBox.appendChild(el);
    });
    const addBtn = document.createElement("button");
    addBtn.className = "add-top";
    addBtn.textContent = "+ 새 메뉴 추가";
    addBtn.onclick = () => { m.nav.push({ label: "새 메뉴", href: "/", children: [] }); setMenu(m); renderNavList(); };
    navBox.appendChild(addBtn);
  }
  renderNavList();

  brand.querySelector("#brand-ko").oninput = (e) => { m.brand.ko = e.target.value; setMenu(m); };
  brand.querySelector("#brand-en").oninput = (e) => { m.brand.en = e.target.value; setMenu(m); };
  cta.querySelector("#cta-label").oninput = (e) => { m.cta.label = e.target.value; setMenu(m); };
  cta.querySelector("#cta-href").oninput = (e) => { m.cta.href = e.target.value; setMenu(m); };
}

// ============================================================
//  내보내기 / 불러오기 / 요약
// ============================================================
function collectEdits(){
  const result = {
    version: 1,
    generatedAt: new Date().toISOString(),
    summary: { textChanges: 0, imageChanges: 0, comments: 0, menuChanged: !!state.menuEdits },
    pages: {},
    menu: state.menuEdits || null,
  };

  CATALOG.pages.forEach(page => {
    if (!page.sections) return;
    const pageEdits = [];
    page.sections.forEach(section => {
      section.items.forEach(it => {
        const e = state.edits[it.id];
        if (!e) return;
        const entry = { id: it.id, section: section.title, label: it.label, type: it.type, original: it.original };
        if (it.type === "image"){
          if (e.imgData){
            entry.newImage = { name: e.imgName, type: e.imgType, size: e.imgSize, dataUrl: e.imgData };
            result.summary.imageChanges++;
          }
        } else {
          if (e.value && e.value !== it.original){
            entry.newValue = e.value;
            result.summary.textChanges++;
          }
        }
        if (e.comment){
          entry.comment = e.comment;
          result.summary.comments++;
        }
        if (entry.newValue || entry.newImage || entry.comment){
          pageEdits.push(entry);
        }
      });
    });
    if (pageEdits.length) result.pages[page.id] = { title: page.title, file: page.file, edits: pageEdits };
  });

  return result;
}

function doExport(){
  const data = collectEdits();
  const total = data.summary.textChanges + data.summary.imageChanges + data.summary.comments + (data.summary.menuChanged?1:0);
  if (total === 0){
    if (!confirm("변경 사항이 없습니다. 그래도 빈 파일을 저장할까요?")) return;
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const today = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `church-edits-${today}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("JSON 파일이 저장되었습니다. 담당자에게 보내주세요.");
}

function showSummary(){
  const data = collectEdits();
  const c = document.getElementById("summary-content");
  const s = data.summary;
  const total = s.textChanges + s.imageChanges + s.comments + (s.menuChanged?1:0);
  if (total === 0){
    c.innerHTML = `<p style="color:var(--mute)">아직 변경한 항목이 없습니다.</p>`;
  } else {
    let html = `
      <p>총 <strong>${total}건</strong>의 변경 — 글자 ${s.textChanges} · 사진 ${s.imageChanges} · 코멘트 ${s.comments}${s.menuChanged?' · 메뉴 변경':''}</p>
    `;
    Object.entries(data.pages).forEach(([pid, p]) => {
      html += `<h4 style="margin:14px 0 6px;color:var(--accent)">${p.title} (${p.edits.length}건)</h4><ul style="margin:0;padding-left:20px;font-size:13px">`;
      p.edits.slice(0, 30).forEach(e => {
        const what = e.newImage ? `🖼 ${e.newImage.name}` : (e.newValue ? `"${e.newValue.slice(0,40)}${e.newValue.length>40?'…':''}"` : "");
        const cmt = e.comment ? ` 💬 ${e.comment.slice(0,40)}` : "";
        html += `<li><b>${e.label}</b> — ${what}${cmt}</li>`;
      });
      if (p.edits.length > 30) html += `<li>… 그 외 ${p.edits.length-30}건</li>`;
      html += `</ul>`;
    });
    if (s.menuChanged){
      html += `<h4 style="margin:14px 0 6px;color:var(--accent)">상단 메뉴 변경됨</h4>`;
    }
    c.innerHTML = html;
  }
  openModal("modal-summary");
}

function doImport(){
  const txt = document.getElementById("import-text").value.trim();
  if (!txt) return;
  try {
    const data = JSON.parse(txt);
    if (data.version !== 1) throw new Error("형식이 맞지 않습니다");
    // 기존 상태에 덮어쓰기
    state.edits = {};
    state.menuEdits = data.menu || null;
    Object.values(data.pages || {}).forEach(p => {
      p.edits.forEach(e => {
        const cur = {};
        if (e.newValue) cur.value = e.newValue;
        if (e.comment) cur.comment = e.comment;
        if (e.newImage){
          cur.imgData = e.newImage.dataUrl;
          cur.imgName = e.newImage.name;
          cur.imgType = e.newImage.type;
          cur.imgSize = e.newImage.size;
        }
        if (Object.keys(cur).length) state.edits[e.id] = cur;
      });
    });
    saveState();
    closeModal("modal-import");
    renderAll();
    toast("불러왔습니다");
  } catch(e){
    alert("불러오기 실패: " + e.message);
  }
}

function resetAll(){
  if (!confirm("작업하신 모든 변경 사항을 지웁니다. 정말 진행할까요?")) return;
  state = defaultState();
  saveState();
  renderAll();
  toast("모두 초기화되었습니다");
}

// ============================================================
//  유틸
// ============================================================
let saveTimer;
function debouncedSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 400); }
function openModal(id){ document.getElementById(id).classList.add("show"); }
function closeModal(id){ document.getElementById(id).classList.remove("show"); }
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

document.getElementById("btn-export").onclick = doExport;
document.getElementById("btn-summary").onclick = showSummary;
document.getElementById("btn-import").onclick = () => { document.getElementById("import-text").value = ""; openModal("modal-import"); };
document.getElementById("btn-reset-all").onclick = resetAll;

renderAll();
</script>
